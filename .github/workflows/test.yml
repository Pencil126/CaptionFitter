name: Test

on:
  push:
    # "**" limits this to branches; without it, the tag created when a
    # release is published would trigger a run too.
    branches: ["**"]
    paths-ignore: ["**.md"]

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Test core package
        run: swift test --package-path Packages/CaptionFitterCore

      - name: Build app
        run: >
          xcodebuild -project CaptionFitter.xcodeproj -scheme CaptionFitter
          -configuration Debug -derivedDataPath .build/xcode build
